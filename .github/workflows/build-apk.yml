name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Kasrace Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Recover invalid Android PNG resources from original artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          def decode(path):
              try:
                  with Image.open(path) as image:
                      image.load()
                      return image.copy()
              except Exception as error:
                  print(f"Invalid image {path}: {error}")
                  return None

          def first_valid(paths, label):
              for raw in paths:
                  path = Path(raw)
                  image = decode(path)
                  if image is not None:
                      print(f"Validated {label} artwork: {path} ({image.size}, {image.mode})")
                      return image
              raise SystemExit(f"No valid original {label} artwork found; refusing to generate substitute artwork.")

          launcher = first_valid([
              "public/icon.png",
              "public/icon-512.png",
              "public/icon-192.png",
              "android/app/src/main/assets/public/icon.png",
              "android/app/src/main/assets/public/icon-192.png",
              "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",
              "android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png",
              "android/app/src/main/res/mipmap-xhdpi/ic_launcher.png",
              "android/app/src/main/res/mipmap-hdpi/ic_launcher.png",
              "src/assets/images/app_launch_icon_1785328942765.jpg",
          ], "launcher")

          splash = first_valid([
              "android/app/src/main/res/drawable/splash.png",
              "android/app/src/main/res/drawable-port-mdpi/splash.png",
              "android/app/src/main/res/drawable-land-mdpi/splash.png",
              "android/app/src/main/res/drawable-port-hdpi/splash.png",
              "android/app/src/main/res/drawable-land-hdpi/splash.png",
              "android/app/src/main/res/drawable-port-xhdpi/splash.png",
              "android/app/src/main/res/drawable-land-xhdpi/splash.png",
              "android/app/src/main/res/drawable-port-xxhdpi/splash.png",
              "android/app/src/main/res/drawable-land-xxhdpi/splash.png",
              "android/app/src/main/res/drawable-port-xxxhdpi/splash.png",
              "android/app/src/main/res/drawable-land-xxxhdpi/splash.png",
              "public/splash.png",
              "src/assets/images/app_launch_icon_1785328942765.jpg",
          ], "splash")

          resource_root = Path("android/app/src/main/res")
          repaired = []
          for target in sorted(resource_root.rglob("*.png")):
              if target.name.startswith("ic_launcher"):
                  source = launcher
              elif target.name == "splash.png":
                  source = splash
              else:
                  continue
              if decode(target) is None:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source.save(target, format="PNG", optimize=False)
                  if decode(target) is None:
                      raise SystemExit(f"Repaired PNG failed validation: {target}")
                  repaired.append(str(target))
                  print(f"Repaired {target}")

          print(f"Repaired {len(repaired)} invalid Android PNG resources.")
          PY

      - name: Restore Gradle Wrapper JAR
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar --output android/gradle/wrapper/gradle-wrapper.jar
          unzip -tq android/gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Prepare persistent Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/kasrace-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kasrace-signing/kasrace.jks"
          test -s "$RUNNER_TEMP/kasrace-signing/kasrace.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kasrace-signing/kasrace.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Android Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="1.0.$VERSION_CODE"

      - name: Rename Release APK to kasrace.apk
        if: github.event_name != 'pull_request'
        run: cp android/app/build/outputs/apk/release/app-release.apk kasrace.apk

      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kasrace.apk
          path: kasrace.apk

      - name: Update latest tag
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish Latest GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Automatically published kasrace.apk from the latest successful Android build on the default release workflow branch.
          files: kasrace.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
