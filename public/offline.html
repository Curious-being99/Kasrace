<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kasrace - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(112, 199, 186, 0.3);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem auto;
      background: rgba(112, 199, 186, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(112, 199, 186, 0.4);
    }
    .icon img {
      width: 48px;
      height: 48px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #70C7BA;
      margin-bottom: 0.75rem;
      letter-spacing: 0.025em;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #70C7BA 0%, #3b82f6 100%);
      color: #020617;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 1.75rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 14px 0 rgba(112, 199, 186, 0.39);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px 0 rgba(112, 199, 186, 0.5);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <img src="/icon-192.png" alt="Kasrace Logo">
    </div>
    <h1>You are Offline</h1>
    <p>Kasrace requires a connection to pair with multiplayer rooms or connect to the Kaspa network. Please check your network connection and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
